<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curitiba Fatal Crash Density: one figure, one crash</title>
<meta name="description" content="Every georeferenced fatal traffic crash in Curitiba (2010–2024) rendered as a human figure, stacked in 3D. Data: IPPUC / BPTRAN. Map: MapLibre GL + deck.gl.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/deck.gl@9.0.40/dist.min.js"></script>
<style>
  :root{
    --panel:#faf9f4; --ink:#1c2b23; --muted:#5f6e63; --line:#dcd9cd;
    --accent:#14532d;
    --c-ped:#e34948; --c-col:#2a78d6; --c-oth:#a07d28;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
  #map{position:absolute;inset:0}
  .panel{
    position:absolute;top:16px;left:16px;z-index:10;width:330px;max-width:calc(100vw - 32px);
    background:var(--panel);border:1px solid var(--line);border-radius:16px;
    box-shadow:0 18px 50px -22px rgba(20,40,28,.45);padding:20px 20px 16px;
    max-height:calc(100vh - 32px);overflow:auto;
  }
  .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px}
  .phead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .langsrow{display:flex;gap:3px;flex:none}
  .langsrow button{font-size:10.5px;letter-spacing:.05em;font-weight:700;cursor:pointer;padding:4px 9px;
    border-radius:999px;color:var(--muted);background:none;border:1px solid transparent;font-family:inherit}
  .langsrow button.on{background:var(--accent);color:#fff}
  h1{font-family:Fraunces,Georgia,serif;font-size:24px;line-height:1.15;margin:0 0 6px;font-weight:600}
  .src{font-size:12.5px;color:var(--muted);margin:0 0 14px}
  .legend{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 2px;margin-bottom:12px}
  .legend svg{flex:none}
  .legend .t{font-size:13px;line-height:1.45}
  .legend .t b{font-weight:700}
  .legend .t small{color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
  .chip{
    display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;
    border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;
  }
  .chip .dot{width:9px;height:9px;border-radius:50%}
  .chip .n{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
  .chip.on{border-color:var(--accent);background:#eef4ee;box-shadow:inset 0 0 0 1px var(--accent)}
  .ctrl{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .btn{
    border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;
    padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .btn.ghost{background:#fff;color:var(--accent)}
  .slider{flex:1;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .slider input{flex:1;accent-color:var(--accent)}
  .hint{font-size:11.5px;color:var(--muted);line-height:1.5;margin-bottom:10px}
  .credits{font-size:10.5px;color:var(--muted);line-height:1.55;border-top:1px solid var(--line);padding-top:10px}
  .credits a{color:var(--accent)}
  .dk-tooltip b{font-weight:700}
  @media (max-width:640px){
    .panel{width:calc(100vw - 24px);top:12px;left:12px;padding:14px 14px 12px;max-height:52vh}
    h1{font-size:20px}
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="panel">
  <div class="phead">
    <div class="eyebrow">Curitiba &middot; 2010&ndash;2024</div>
    <div class="langsrow">
      <button data-setlang="pt">PT</button>
      <button data-setlang="en">EN</button>
      <button data-setlang="es">ES</button>
    </div>
  </div>
  <h1 id="t-title"></h1>
  <p class="src" id="t-src"></p>

  <div class="legend">
    <svg width="18" height="36" viewBox="0 0 64 128" aria-hidden="true"><g fill="#1c2b23"><circle cx="32" cy="17" r="13"/><rect x="17" y="34" width="30" height="46" rx="11"/><rect x="19" y="80" width="11" height="42" rx="4"/><rect x="34" y="80" width="11" height="42" rx="4"/></g></svg>
    <div class="t" id="t-legend"></div>
  </div>

  <div class="chips" id="chips">
    <button class="chip on" data-f="-1"><span id="t-c0">All</span> <span class="n" data-n="2843"></span></button>
    <button class="chip" data-f="0"><span class="dot" style="background:var(--c-ped)"></span><span id="t-c1">Pedestrians struck</span> <span class="n" data-n="1052"></span></button>
    <button class="chip" data-f="1"><span class="dot" style="background:var(--c-col)"></span><span id="t-c2">Collisions</span> <span class="n" data-n="1163"></span></button>
    <button class="chip" data-f="2"><span class="dot" style="background:var(--c-oth)"></span><span id="t-c3">Other</span> <span class="n" data-n="628"></span></button>
  </div>

  <div class="ctrl">
    <button class="btn" id="tilt">2D</button>
    <div class="slider"><span id="t-fig">Figure</span><input id="size" type="range" min="24" max="110" value="62" step="2"><span id="sizev">62&nbsp;m</span></div>
  </div>

  <p class="hint" id="t-hint"></p>

  <div class="credits" id="t-credits"></div>
</div>

const COLORS = [[227,73,72,255],[42,120,214,255],[160,125,40,255]];

const STR = {

  src:'IPPUC · painel “Acidente de Trânsito” (BPTRAN / SMDT) · somente sinistros fatais',
  legend:'<b>1 boneco = 1 sinistro fatal</b><br><small>2.843 mapeados de 2.947 sinistros · 3.073 vidas perdidas</small>',
  chips:['Todos','Atropelamentos','Colisões','Outros'],
  fig:'Boneco',
  hint:'Arraste para mover · botão direito (ou dois dedos) para girar e inclinar · passe o mouse numa pilha para ver detalhes. Sinistros agrupados em células de ~165 m; cada pilha é uma célula.',

  chips:['All','Pedestrians struck','Collisions','Other'],
  fig:'Figure',
  hint:'Drag to pan · right-drag (or two fingers) to rotate and tilt · hover a stack for details. Crashes are grouped in ~165 m cells; each stack is one cell.',
  credits:'Data: IPPUC / BPTRAN–SMDT (fatal crashes, 2010–2024). Basemap © OpenStreetMap contributors, © CARTO. MapLibre GL + deck.gl. Analysis: <a href="https://avnergomes.github.io/portfolio/" target="_blank" rel="noopener">Avner Gomes</a> · <a href="index.html#en">report</a> · <a href="dashboard.html">dashboard</a>',

},
es:{
  title:'Quince años de muertes en el tránsito, humanizados',
  src:'IPPUC · panel “Acidente de Trânsito” (BPTRAN / SMDT) · solo siniestros fatales',
  legend:'<b>1 figura = 1 siniestro fatal</b><br><small>2.843 mapeados de 2.947 siniestros · 3.073 vidas perdidas</small>',
  chips:['Todos','Atropellos','Colisiones','Otros'],

let LANG = 'pt';

function applyLang(){
  const s = STR[LANG];
  document.documentElement.lang = LANG === 'pt' ? 'pt-BR' : LANG;
  document.getElementById('t-title').textContent = s.title;
  document.getElementById('t-src').textContent = s.src;
  document.getElementById('t-legend').innerHTML = s.legend;
  ['t-c0','t-c1','t-c2','t-c3'].forEach((id,i)=>{ document.getElementById(id).textContent = s.chips[i]; });
  document.getElementById('t-fig').textContent = s.fig;
  document.getElementById('t-hint').textContent = s.hint;
  document.getElementById('t-credits').innerHTML = s.credits;
  document.querySelectorAll('.langsrow button').forEach(b=>b.classList.toggle('on', b.getAttribute('data-setlang')===LANG));
  const sep = LANG === 'en' ? ',' : '.';
  document.querySelectorAll('[data-n]').forEach(el=>{
    el.textContent = (+el.getAttribute('data-n')).toString().replace(/\B(?=(\d{3})+(?!\d))/g, sep);
  });
}
function setLang(l){ LANG = l; applyLang(); history.replaceState(null,'','#'+l); }

let filter = -1;
let figH = 62;

/* white person sprite -> colored via mask */
const atlas = (() => {
  const c = document.createElement('canvas'); c.width = 64; c.height = 128;
  const g = c.getContext('2d'); g.fillStyle = '#fff';
  g.beginPath(); g.arc(32, 17, 13, 0, Math.PI * 2); g.fill();
  const rr = (x, y, w, h, r) => { g.beginPath(); g.roundRect(x, y, w, h, r); g.fill(); };
  rr(17, 34, 30, 46, 11);      /* torso  */
  rr(19, 80, 11, 42, 4);       /* legs   */
  rr(34, 80, 11, 42, 4);
  return c;
})();
const MAPPING = { p: { x: 0, y: 0, width: 64, height: 128, mask: true, anchorY: 128 } };

/* figures: [lon, lat, level, cat, binIdx] — restacked per filter */
function buildFigures() {
  const figs = [];
  for (let bi = 0; bi < D.bins.length; bi++) {
    const b = D.bins[bi];
    const counts = [[0, b[2]], [1, b[3]], [2, b[4]]];
    const use = filter < 0
      ? counts.slice().sort((a, z) => z[1] - a[1])   /* dominant type at the base */
      : [counts[filter]];
    let lvl = 0;
    for (const [cat, n] of use)
      for (let k = 0; k < n; k++) figs.push([b[0], b[1], lvl++, cat, bi]);
  }
  return figs;
}
let figures = buildFigures();

function makeLayer() {
  return new deck.IconLayer({
    id: 'figures',
    data: figures,
    iconAtlas: atlas,
    iconMapping: MAPPING,
    getIcon: () => 'p',
    billboard: true,
    sizeUnits: 'meters',
    getSize: figH,
    sizeMinPixels: 3,
    sizeMaxPixels: 90,
    getPosition: d => [d[0], d[1], d[2] * figH * 1.05],
    getColor: d => COLORS[d[3]],
    pickable: true,
    updateTriggers: { getPosition: [figH], getSize: [figH] }
  });
}

const overlay = new deck.MapboxOverlay({
  interleaved: false,
  layers: [makeLayer()],
  getTooltip: ({ object }) => {
    if (!object) return null;
    const b = D.bins[object[4]];
    const tot = b[2] + b[3] + b[4];
    const cats = STR[LANG].cats;
    const row = (n, cat, col) => n ? `<div><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${col};margin-right:6px"></span>${n} ${cat}</div>` : '';
    return {
      html: `<div class="dk-tooltip">${STR[LANG].tip(tot)}` +
            row(b[2], cats[0], '#e34948') + row(b[3], cats[1], '#2a78d6') + row(b[4], cats[2], '#a07d28') + '</div>',
      style: {
        background: '#faf9f4', color: '#1c2b23', fontSize: '12.5px', lineHeight: '1.55',
        padding: '9px 12px', borderRadius: '10px', border: '1px solid #dcd9cd',
        fontFamily: 'Inter, system-ui, sans-serif', boxShadow: '0 8px 24px -12px rgba(20,40,28,.5)'
      }
    };
  }
});

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
  center: [-49.2715, -25.4485],
  zoom: 12.0,
  pitch: 55,
  bearing: -18,
  maxPitch: 70,
  antialias: true
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
map.addControl(overlay);

function refresh() { overlay.setProps({ layers: [makeLayer()] }); }

/* filter chips */
document.getElementById('chips').addEventListener('click', e => {
  const chip = e.target.closest('.chip'); if (!chip) return;
  filter = +chip.dataset.f;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === chip));
  figures = buildFigures();
  refresh();
});

/* 2D / 3D toggle */
const tiltBtn = document.getElementById('tilt');
tiltBtn.addEventListener('click', () => {
  const to3d = map.getPitch() < 5;
  map.easeTo({ pitch: to3d ? 55 : 0, bearing: to3d ? -18 : 0, duration: 900 });
  tiltBtn.textContent = to3d ? '2D' : '3D';
});

/* figure size */
const sizeIn = document.getElementById('size'), sizeV = document.getElementById('sizev');
sizeIn.addEventListener('input', () => {
  figH = +sizeIn.value;
  sizeV.innerHTML = figH + '&nbsp;m';
  refresh();
});

/* language */
document.querySelectorAll('.langsrow button').forEach(b => { b.onclick = () => setLang(b.getAttribute('data-setlang')); });
const hash = (location.hash || '').replace('#', '').toLowerCase();
LANG = (hash === 'en' || hash === 'es' || hash === 'pt') ? hash : 'pt';
applyLang();
