 thesis:"Cruzamos 2.843 sinistros fatais georreferenciados (2010–2024) para responder a uma única pergunta: qual é o trecho mais perigoso da cidade? A resposta não é uma rodovia veloz nem uma curva traiçoeira. É o centro caminhável. E o padrão que aparece logo depois dele muda o tipo de solução que a cidade precisa.",

 k1:"A pergunta",h1s:"Todo motorista tem um palpite",
 p1a:"Uma esquina, uma curva, um cruzamento onde “sempre tem acidente”. Mas o palpite não precisa ser palpite. Cada sinistro fatal registrado em Curitiba tem uma coordenada: uma latitude e uma longitude exatas. Quando se empilham quinze anos desses pontos sobre o mapa, o trânsito da cidade deixa de ser anedota e vira geografia.",
 p1b:"Foi o que fizemos. Pegamos os 2.843 sinistros fatais com localização conhecida entre 2010 e 2024 e os agrupamos por proximidade; tudo que cai num raio de cerca de 140 metros vira um mesmo “trecho”. Depois, contamos. O trecho com mais mortes ganha o título que ninguém quer.",

 p2a:"Não é uma rodovia veloz nem uma curva traiçoeira. É o centro: denso, caminhável, cheio de gente atravessando. A área mais movimentada a pé da cidade é também a que mais atropela, num raio de pouco mais de um quarteirão.",
 k3:"No mapa",h3s:"Os 15 trechos mais perigosos",
 p3a:"O marcador 1 é o trecho da Rua Barão do Serro Azul. O tamanho de cada bolha é proporcional ao número de mortes; ao fundo, em calor, a mancha dos 2.843 sinistros. Clique nos pontos para ver os detalhes.",

 p4a:"Olhe a lista abaixo do primeiro colocado e um padrão salta aos olhos. A canaleta exclusiva do BRT, os corredores de ônibus que tornaram Curitiba mundialmente famosa, aparece sete vezes entre os quinze trechos mais letais (Pinheirinho, Capão Raso, Tarumã, Atuba, Cajuru). Faixas largas, ônibus rápidos e muita gente atravessando para alcançar as estações-tubo: a receita do atropelamento.",
 p4b:"E o Rodoanel / Contorno Leste, a via de alta velocidade que circunda a cidade, surge três vezes (Tatuquara, Sítio Cercado, Ganchinho), com a Rodovia do Café (BR-376) completando o grupo das vias rápidas. Aqui o perfil muda: colisões e capotamentos em velocidade somam-se aos atropelamentos.",
 pull1:"O centro mata pela densidade; as canaletas, pela travessia; o anel viário, pela velocidade.",

let LANG="pt";
const T=()=>I18N[LANG];

/* ---------- static texts ---------- */
function applyStatic(){
  document.documentElement.lang = LANG==="pt"?"pt-BR":LANG;
  document.title = T().docTitle;
  document.getElementById("nav-brand").textContent = T().brand;
  document.getElementById("hero-title").textContent = T().title;
  document.querySelectorAll("[data-i]").forEach(el=>{
    const k = el.getAttribute("data-i");
    if (T()[k] !== undefined) el.innerHTML = T()[k];
  });
  document.getElementById("btn3d").href = "mapa3d.html#" + LANG;
  const sep = LANG === "en" ? "," : ".";
  document.querySelectorAll("[data-n]").forEach(el=>{
    el.textContent = (+el.getAttribute("data-n")).toString().replace(/\B(?=(\d{3})+(?!\d))/g, sep);
  });
}

/* ---------- ranking table ---------- */
function renderTable(){
  document.getElementById("rk").innerHTML = D.top.map(t=>{
    const ped = t.dom === "atropelamento";
    const dom = T().dom[t.dom] || t.dom;
    return `<tr><td class="rk num">${t.rank}</td><td><b>${t.road}</b></td>`+
      `<td style="color:var(--mut)">${t.suburb}</td>`+
      `<td><span class="tag ${ped?"ped":""}">${dom} · ${t.domN}</span></td>`+
      `<td class="num" style="text-align:right;font-weight:600">${t.n}</td></tr>`;
  }).join("");
}

/* ---------- map ---------- */
let map, markers=[];
function initMap(){
  map = L.map("map",{scrollWheelZoom:false}).setView([D.top[0].lat,D.top[0].lon],14);
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",
    {maxZoom:19,maxNativeZoom:16,attribution:"Esri, HERE, Garmin, © OpenStreetMap contributors"}).addTo(map);
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}",
    {maxZoom:19,maxNativeZoom:16}).addTo(map);
  L.heatLayer(D.points.map(p=>[p[0],p[1],0.5]),{radius:11,blur:15,minOpacity:.14,max:6,
    gradient:{0.3:"#2c7fb8",0.5:"#41b6c4",0.7:"#fed976",0.85:"#fd8d3c",1:"#e31a1c"}}).addTo(map);
  D.top.forEach(t=>{
    const size=20+Math.round(Math.sqrt(t.n)*5);
    const isPed=t.dom==="atropelamento";
    const col=t.rank===1?"#ff2d2d":(isPed?"#eda100":"#ff5a5f");
    const icon=L.divIcon({className:"",iconSize:[size,size],iconAnchor:[size/2,size/2],
      html:`<div class="pin ${t.rank===1?"p1":""}" style="width:${size}px;height:${size}px;background:${col}">${t.rank}</div>`});
    const m=L.marker([t.lat,t.lon],{icon}).addTo(map);
    m._t=t; markers.push(m);
  });
  bindPopups();
  document.getElementById("b1").onclick=()=>map.setView([D.top[0].lat,D.top[0].lon],15);
  document.getElementById("ball").onclick=()=>{const g=L.featureGroup(markers);map.fitBounds(g.getBounds().pad(0.15));};
}
function bindPopups(){
  markers.forEach(m=>{
    const t=m._t, dom=T().dom[t.dom]||t.dom;
    m.bindPopup(`<b>#${t.rank} · ${t.road}</b><br>${t.suburb}<br><b>${t.n}</b> ${T().popN}<br>${T().popDom}: ${dom} (${t.domN})`);
  });
}

/* ---------- annual trend (SVG line) ---------- */
function renderTrend(){
  const svg=document.getElementById("trend");
  const W=960,H=300,mL=52,mR=18,mT=26,mB=40;
  const xs=D.ano.map(a=>+a[0]), ys=D.ano.map(a=>a[1]);
  const x=i=>mL+(W-mL-mR)*i/(xs.length-1);
  const yMax=340, y=v=>mT+(H-mT-mB)*(1-v/yMax);
  let g="";
  for(const gv of [0,100,200,300]){
    g+=`<line x1="${mL}" x2="${W-mR}" y1="${y(gv)}" y2="${y(gv)}" stroke="oklch(28% 0.028 265)" stroke-width="1"/>`;
    g+=`<text x="${mL-8}" y="${y(gv)+4}" text-anchor="end" font-size="11" fill="oklch(62% 0.022 265)" font-family="JetBrains Mono,monospace">${gv}</text>`;
  }
  xs.forEach((yr,i)=>{ if(i%2===0) g+=`<text x="${x(i)}" y="${H-14}" text-anchor="middle" font-size="11" fill="oklch(62% 0.022 265)" font-family="JetBrains Mono,monospace">${yr}</text>`; });
  const pts=ys.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
  g+=`<polyline points="${pts}" fill="none" stroke="oklch(64% 0.20 25)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  ys.forEach((v,i)=>{ g+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.4" fill="oklch(64% 0.20 25)" stroke="oklch(14% 0.025 265)" stroke-width="1.5"/>`; });
  const lab=(i,dy)=>`<text x="${x(i)}" y="${y(ys[i])+dy}" text-anchor="middle" font-size="12.5" font-weight="600" fill="oklch(96% 0.01 265)" font-family="Inter,sans-serif">${ys[i]}</text>`;
  g+=lab(0,-10)+lab(ys.length-1,-10);
  g+=`<text x="${mL}" y="14" font-size="11" fill="oklch(62% 0.022 265)" font-family="JetBrains Mono,monospace">${T().yAxis}</text>`;
  svg.innerHTML=g;
}

/* ---------- 3D mock figures in CTA ---------- */
function renderMock(){
  const gEl=document.getElementById("mockfigs");
  const cols=["#e34948","#2a78d6","#a07d28"];
  let out="", seed=7;
  const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  for(let i=0;i<26;i++){
    const bx=40+rnd()*390, by=70+rnd()*170, n=1+Math.floor(rnd()*rnd()*9);
    for(let k=0;k<n;k++){
      const c=cols[rnd()<0.45?0:(rnd()<0.6?1:2)];
      out+=`<g transform="translate(${bx},${by-k*11}) scale(0.075)" fill="${c}">`+
        `<circle cx="32" cy="17" r="13"/><rect x="17" y="34" width="30" height="46" rx="11"/>`+
        `<rect x="19" y="80" width="11" height="42" rx="4"/><rect x="34" y="80" width="11" height="42" rx="4"/></g>`;
    }
  }
  gEl.innerHTML=out;
}

/* ---------- lang + init ---------- */
function setLang(l){
  LANG=l;
  document.querySelectorAll(".langs button").forEach(b=>b.classList.toggle("on",b.getAttribute("data-setlang")===l));
  applyStatic(); renderTable(); renderTrend(); if(map) bindPopups();
  history.replaceState(null,"","#"+l);
}
function init(){
  document.querySelectorAll(".langs button").forEach(b=>{b.onclick=()=>setLang(b.getAttribute("data-setlang"));});
  window.addEventListener("scroll",()=>{
    const h=document.documentElement,sc=h.scrollTop/(h.scrollHeight-h.clientHeight);
    document.getElementById("prog").style.width=(sc*100)+"%";
  },{passive:true});
  const hash=(location.hash||"").replace("#","").toLowerCase();
  LANG = (hash==="en"||hash==="es"||hash==="pt")?hash:"pt";
  document.querySelectorAll(".langs button").forEach(b=>b.classList.toggle("on",b.getAttribute("data-setlang")===LANG));
  applyStatic(); renderTable(); renderTrend(); renderMock(); initMap(); bindPopups();
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init); else init();
